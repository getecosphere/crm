<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Inside the CRM: A Lead Distribution Platform Built on eco</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.6" stop-color="#faf6ec"/>
      <stop offset="1" stop-color="#f3ecd9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="160" r="260" fill="#f3c4ab" opacity="0.45"/>
  <circle cx="180" cy="760" r="300" fill="#c6d9d0" opacity="0.5"/>

  <g transform="translate(140,130)">
    <text x="0" y="70" font-family="'Bricolage Grotesque','Arial Black',sans-serif" font-size="88" font-weight="800" fill="#0f1e1a" letter-spacing="-1">Inside the CRM</text>
    <text x="0" y="190" font-family="'Bricolage Grotesque','Arial Black',sans-serif" font-size="46" font-weight="800" fill="#059669" letter-spacing="-0.5">A lead distribution platform built on eco</text>
    <text x="0" y="270" font-family="Onest,'Helvetica Neue',sans-serif" font-size="26" fill="#4d806d">Sales reps register · Administrators route · Partners close · eco composes.</text>
  </g>

  <g transform="translate(140,380)">
    <g font-family="'Bricolage Grotesque',sans-serif">
      <rect width="330" height="170" rx="20" fill="#ffffff" stroke="#e2ece7" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#059669"/>
      <text x="48" y="59" font-size="26" fill="#fff" text-anchor="middle">1</text>
      <text x="88" y="58" font-size="26" font-weight="800" fill="#0f1e1a">Domain</text>
      <text x="30" y="105" font-size="18" fill="#4d806d">One self-sustaining</text>
      <text x="30" y="132" font-size="18" fill="#4d806d">feature, no domain bleed.</text>
    </g>
    <g transform="translate(360,0)" font-family="'Bricolage Grotesque',sans-serif">
      <rect width="330" height="170" rx="20" fill="#ffffff" stroke="#e2ece7" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#0f1e1a"/>
      <text x="48" y="59" font-size="26" fill="#fff" text-anchor="middle">2</text>
      <text x="88" y="58" font-size="26" font-weight="800" fill="#0f1e1a">Compose</text>
      <text x="30" y="105" font-size="18" fill="#4d806d">eco wires services,</text>
      <text x="30" y="132" font-size="18" fill="#4d806d">ports, and routes.</text>
    </g>
    <g transform="translate(720,0)" font-family="'Bricolage Grotesque',sans-serif">
      <rect width="330" height="170" rx="20" fill="#ffffff" stroke="#e2ece7" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#d65f2e"/>
      <text x="48" y="59" font-size="26" fill="#fff" text-anchor="middle">3</text>
      <text x="88" y="58" font-size="26" font-weight="800" fill="#0f1e1a">Serve</text>
      <text x="30" y="105" font-size="18" fill="#4d806d">Live on crm.stuff8.com,</text>
      <text x="30" y="132" font-size="18" fill="#4d806d">deployed via webhooks.</text>
    </g>
    <g transform="translate(0,200)" font-family="'Bricolage Grotesque',sans-serif">
      <rect width="330" height="150" rx="20" fill="#ffffff" stroke="#e2ece7" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#059669"/>
      <text x="48" y="59" font-size="26" fill="#fff" text-anchor="middle">4</text>
      <text x="88" y="58" font-size="26" font-weight="800" fill="#0f1e1a">Reuse</text>
      <text x="30" y="105" font-size="18" fill="#4d806d">Drop domains into any</text>
      <text x="30" y="132" font-size="18" fill="#4d806d">new composition.</text>
    </g>
    <g transform="translate(360,200)" font-family="'Bricolage Grotesque',sans-serif">
      <rect width="330" height="150" rx="20" fill="#ffffff" stroke="#e2ece7" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#0f1e1a"/>
      <text x="48" y="59" font-size="26" fill="#fff" text-anchor="middle">5</text>
      <text x="88" y="58" font-size="26" font-weight="800" fill="#0f1e1a">Read</text>
      <text x="30" y="105" font-size="18" fill="#4d806d">eco_docs + theme make</text>
      <text x="30" y="132" font-size="18" fill="#4d806d">every estate consistent.</text>
    </g>
  </g>
</svg>
