  <circle cx="1250" cy="180" r="240" fill="url(#orb)" opacity="0.35"/>
  <circle cx="220" cy="760" r="280" fill="url(#orb2)" opacity="0.28"/>
  <circle cx="1380" cy="720" r="120" fill="url(#orb)" opacity="0.18"/>

  <g transform="translate(120,190)">
    <g stroke="#0f1e1a" stroke-width="0" opacity="0.9">
      <rect x="0" y="0" width="200" height="140" rx="24" fill="none" stroke="#0f1e1a"/>
    </g>
  </g>

  <g transform="translate(118,188)" opacity="0.95">
    <rect width="210" height="148" rx="26" fill="none" stroke="#34d399" stroke-width="3"/>
    <circle cx="105" cy="74" r="34" fill="none" stroke="#faf6ec" stroke-width="3"/>
    <path d="M105 62v12M105 86v-4M105 74h14M105 74H91" stroke="#faf6ec" stroke-width="5" stroke-linecap="round"/>
    <circle cx="105" cy="74" r="4" fill="#eb9e77"/>
